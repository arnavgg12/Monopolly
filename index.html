<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Property Tycoon — Multiplayer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1a2b" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- LOBBY -->
  <main id="lobby">
    <div class="lobby-card">
      <h1>Property Tycoon</h1>
      <div class="sub">Mobile-friendly Monopoly with voice chat. No accounts, no installs — share a link.</div>

      <!-- Host section -->
      <div id="host-section">
        <label for="host-name">Your name</label>
        <input id="host-name" type="text" placeholder="e.g. Arnav" maxlength="20" />
        <div class="row" style="margin-top: 10px;">
          <button id="host-btn">Create a room</button>
        </div>

        <div id="host-share" class="hidden" style="margin-top: 14px;">
          <div class="sub" style="margin-bottom: 6px;">Room code: <span id="room-code"></span></div>
          <label>Share this link:</label>
          <div class="row">
            <input id="share-url" type="text" readonly />
            <button id="copy-url-btn" class="ghost">Copy link</button>
          </div>
          <div style="margin-top: 12px;">
            <div class="sub">Players in lobby (<span id="peer-count">0</span>):</div>
            <ul id="lobby-peers"></ul>
            <button id="start-game-btn" disabled>Start game</button>
          </div>
        </div>
      </div>

      <!-- Join section -->
      <div id="join-section" class="hidden">
        <div class="sub">Joining room <strong id="join-room-label"></strong></div>
        <label for="join-name">Your name</label>
        <input id="join-name" type="text" placeholder="e.g. Pia" maxlength="20" />
        <div class="row" style="margin-top: 10px;">
          <button id="join-btn">Join room</button>
        </div>
        <div style="margin-top: 12px;">
          <div class="sub">Players (<span id="peer-count">0</span>):</div>
          <ul id="lobby-peers"></ul>
        </div>
      </div>

      <div style="margin-top: 14px;">
        <div class="sub">Status</div>
        <div id="lobby-status"></div>
      </div>
    </div>
  </main>

  <!-- GAME -->
  <main id="game" class="hidden">
    <header id="topbar">
      <div class="title">🏠 Property Tycoon</div>
      <div id="turn-indicator"></div>
      <div class="voice-controls">
        <button id="mute-btn">🎤 Mute</button>
      </div>
    </header>

    <section id="board-wrap">
      <div id="board"></div>
    </section>

    <aside id="sidebar">
      <div class="panel">
        <h3>Players</h3>
        <div id="players"></div>
      </div>
      <div class="panel">
        <h3>Your turn</h3>
        <div id="action-panel"></div>
      </div>
      <div class="panel">
        <h3>Your properties</h3>
        <div id="my-properties"></div>
      </div>
      <div class="panel" id="trade-panel-wrap">
        <h3>Trade</h3>
        <div id="trade-panel"></div>
      </div>
      <div class="panel">
        <h3>Game log</h3>
        <div id="log"></div>
      </div>
    </aside>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
